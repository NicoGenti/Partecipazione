name: Deploy to GitHub Pages

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_AZURE_ACCOUNT_URL:    ${{ secrets.AZURE_ACCOUNT_URL }}
          VITE_AZURE_CONTAINER:      ${{ secrets.AZURE_CONTAINER }}
          VITE_AZURE_SAS:            ${{ secrets.AZURE_SAS }}
          VITE_WATERMARK_ENABLED:    ${{ vars.VITE_WATERMARK_ENABLED }}
          VITE_DASHBOARD_ENDPOINT:   ${{ secrets.VITE_DASHBOARD_ENDPOINT }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
